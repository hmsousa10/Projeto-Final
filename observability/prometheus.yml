global:
  scrape_interval: 10s
  scrape_timeout: 4s
scrape_configs:
  - job_name: nexo-probes
    metrics_path: /probe
    params:
      module: [http_health]
    http_sd_configs:
      - url: http://nexo:8000/internal/targets
        refresh_interval: 5s
        follow_redirects: false
        authorization:
          credentials_file: /run/secrets/monitoring_discovery
    sample_limit: 1000
    target_limit: 52
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
